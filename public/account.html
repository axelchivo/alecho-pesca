  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function renderAccountContent() {
      const container = document.getElementById('account-content');
      if (!container) return;

      if (!currentUser) {
        container.innerHTML = `
          <div class="row">
            <div class="col-lg-6 mb-4">
              <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                  <h4 class="mb-0"><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</h4>
                </div>
                <div class="card-body p-4">
                  <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="mb-3">
                      <label for="email" class="form-label">Email</label>
                      <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                      <label for="password" class="form-label">Contraseña</label>
                      <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                      <i class="fas fa-sign-in-alt"></i> Entrar
                    </button>
                  </form>
                  <hr>
                  <p class="small text-center text-muted mb-0">¿No tienes cuenta? Regístrate en la columna de al lado.</p>
                </div>
              </div>
            </div>
            <div class="col-lg-6 mb-4">
              <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                  <h4 class="mb-0"><i class="fas fa-user-plus"></i> Registrarse</h4>
                </div>
                <div class="card-body p-4">
                  <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="mb-3">
                      <label for="name" class="form-label">Nombre</label>
                      <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                      <label for="email2" class="form-label">Email</label>
                      <input type="email" class="form-control" id="email2" name="email" required>
                    </div>
                    <div class="mb-3">
                      <label for="password2" class="form-label">Contraseña</label>
                      <input type="password" class="form-control" id="password2" name="password" required>
                    </div>
                    <div class="mb-3">
                      <label for="type" class="form-label">Tipo de cliente</label>
                      <select class="form-select" id="type" name="type" required>
                        <option value="minorista" selected>Minorista</option>
                        <option value="mayorista">Mayorista</option>
                      </select>
                      <div class="form-text">Los clientes mayoristas reciben descuento automático en las compras.</div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                      <i class="fas fa-user-plus"></i> Crear Cuenta
                    </button>
                  </form>
                  <hr>
                  <p class="small text-center text-muted mb-0">¿Ya tienes cuenta? Inicia sesión en la columna de al lado.</p>
                </div>
              </div>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="row">
          <div class="col-lg-8">
            <div class="card shadow-sm">
              <div class="card-header bg-dark text-white">
                <h4 class="mb-0"><i class="fas fa-user-circle"></i> Mi cuenta</h4>
              </div>
              <div class="card-body p-4">
                <form id="profile-form">
                  <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" value="${currentUser.email}" disabled>
                  </div>
                  <div class="mb-3">
                    <label for="profile-name" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="profile-name" value="${currentUser.name || ''}" required>
                  </div>
                  ${currentUser.isAdmin ? '' : `
                  <div class="mb-3">
                    <label for="profile-location" class="form-label">Ubicación</label>
                    <input type="text" class="form-control" id="profile-location" value="${currentUser.location || ''}" placeholder="Ciudad, barrio, etc.">
                  </div>
                  `}
                  <hr>
                  <div class="mb-3">
                    <label for="profile-current-password" class="form-label">Contraseña actual</label>
                    <input type="password" class="form-control" id="profile-current-password" placeholder="Déjalo vacío si no cambias la contraseña">
                  </div>
                  <div class="mb-3">
                    <label for="profile-new-password" class="form-label">Nueva contraseña</label>
                    <input type="password" class="form-control" id="profile-new-password" placeholder="Nueva contraseña">
                  </div>
                  <div class="mb-3">
                    <label for="profile-confirm-password" class="form-label">Repetir nueva contraseña</label>
                    <input type="password" class="form-control" id="profile-confirm-password" placeholder="Repetir nueva contraseña">
                  </div>
                  <button type="submit" class="btn btn-primary">Guardar cambios</button>
                </form>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card shadow-sm mb-4">
              <div class="card-header bg-dark text-white">
                <h5 class="mb-0"><i class="fas fa-cogs"></i> Acciones</h5>
              </div>
              <div class="card-body">
                <button id="logout-button" class="btn btn-outline-secondary w-100 mb-2" type="button">Cerrar sesión</button>
                ${currentUser.isAdmin ? '' : '<a href="orders.html" class="btn btn-outline-primary w-100 mb-2">Ver pedidos</a>'}
                ${currentUser.isAdmin ? '<a href="admin.html" class="btn btn-warning w-100">Panel de administración</a>' : ''}
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('profile-form').addEventListener('submit', handleProfileUpdate);
      document.getElementById('logout-button').addEventListener('click', () => {
        handleLogout();
      });
    }

    async function handleProfileUpdate(e) {
      e.preventDefault();
      const name = document.getElementById('profile-name').value.trim();
      const locationEl = document.getElementById('profile-location');
      const location = locationEl ? locationEl.value.trim() : '';
      const currentPassword = document.getElementById('profile-current-password').value;
      const newPassword = document.getElementById('profile-new-password').value;
      const confirmPassword = document.getElementById('profile-confirm-password').value;

      if (newPassword && newPassword !== confirmPassword) {
        showMessage('Las contraseñas nuevas no coinciden', 'danger');
        return;
      }

      const body = { name };
      if (locationEl) body.location = location;
      if (newPassword) {
        body.currentPassword = currentPassword;
        body.newPassword = newPassword;
      }

      const res = await fetch(api.me, {
        method: 'PUT',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if (data.success) {
        showMessage('Perfil actualizado', 'success');
        await loadCurrentUser();
        renderAccountContent();
      } else {
        showMessage(data.error || 'No se pudo actualizar el perfil', 'danger');
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await loadCurrentUser();
      renderAccountContent();
    });
  </script>

  <a href="https://wa.me/5491163749402" class="whatsapp-float" target="_blank">
    <i class="fab fa-whatsapp"></i>
  </a>
</body>
